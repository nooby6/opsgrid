spring:
  application:
    name: opsgrid
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/opsgrid}
    username: ${DATABASE_USERNAME:opsgrid}
    password: ${DATABASE_PASSWORD:opsgrid}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/opsgrid}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/opsgrid/protocol/openid-connect/certs}

server:
  port: ${PORT:8080}
